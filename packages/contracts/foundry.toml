[profile.default]
solc = "0.8.24"
# foundry upgrades requirements
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
# end foundry upgrades requirements
fuzz_runs = 256
optimizer = true
optimizer_runs = 3000
via_ir = true
verbosity = 2
src = "src"
test = "test"
out = "out"
allow_paths = [
  # pnpm symlinks to the project root's node_modules
  "../../node_modules",
  # template uses linked mud packages from within the mud monorepo
  "../../../../packages",
  # projects created from this template and using linked mud packages
  "../../../mud/packages",
]
extra_output_files = [
  "abi",
  "evm.bytecode"
]
fs_permissions = [{ access = "read", path = "./"}]

gas_reports = ["*"]
